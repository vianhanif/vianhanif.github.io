name: Sync CV

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync CV from vianhanif/my-cv
        run: python3 scripts/sync-cv.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _tabs/cv.md
          git diff --staged --quiet || git commit -m "chore: sync CV from vianhanif/my-cv"
          git push
